# tabIt chord-accuracy benchmark — Billboard multi-genre song manifest.
#
# Sprint 0 (docs/BETA_ROADMAP.md) diagnostic pilot: a small multi-genre sample
# on top of the Beatles-only pilot in ../manifest.yaml, to surface failure
# modes outside 60s British rock. Ground truth is the McGill Billboard
# Project's `full.lab` chord annotations (CC0) — same 3-column
# `start end label` shape as the Isophonics .lab files, so
# engine/eval.py::load_lab and benchmarks/chord_accuracy.py needed no changes.
#
# Genre buckets (a few songs each, per the roadmap):
#   - acoustic/singer-songwriter: country_road, sounds_of_silence, bread_if
#   - syncopated/non-4-on-the-floor: cold_sweat, super_freak, jungle_boogie
#   - closest available "modern pop" proxy: hold_on, motownphilly, the_power
#     (the Billboard corpus samples 1958-1991 chart slots, so this bucket is
#     honestly a late-80s/early-90s proxy, not truly modern pop)
#
# Run:  python -m benchmarks.chord_accuracy --manifest benchmarks/billboard/manifest.yaml

- id: country_road
  title: "James Taylor — Country Road"
  url: "https://www.youtube.com/watch?v=Ub4VAXqfZvk"   # Country Road (2019 Remaster), James Taylor channel, 203s vs 203.5s ref (-0.2%)
  lab: annotations/country_road.lab
  ref_duration: 203.5
  offset_sec: 0.0

- id: sounds_of_silence
  title: "Simon & Garfunkel — The Sounds of Silence"
  url: "https://www.youtube.com/watch?v=4fWyzwo1xg0"   # The Sounds of Silence (Audio), official channel, 187s vs 189.4s ref (-1.3%)
  lab: annotations/sounds_of_silence.lab
  ref_duration: 189.4
  offset_sec: 0.0

- id: bread_if
  title: "Bread — If"
  url: "https://www.youtube.com/watch?v=n-cK70DXsSA"   # If, "Bread - Topic" official audio channel, 156s vs 155.5s ref (+0.3%)
  lab: annotations/bread_if.lab
  ref_duration: 155.5
  offset_sec: 0.0

- id: cold_sweat
  title: "James Brown — Cold Sweat"
  url: "https://www.youtube.com/watch?v=qkgIoMuaoQ0"   # Cold Sweat, James Brown official channel, 172s vs 171.9s ref (+0.1%)
  lab: annotations/cold_sweat.lab
  ref_duration: 171.9
  offset_sec: 0.0

- id: super_freak
  title: "Rick James — Super Freak"
  url: "https://www.youtube.com/watch?v=QYHxGBH6o4M"   # Super Freak (Official Music Video), Rick James channel, 203s vs 201.8s ref (+0.6%)
  lab: annotations/super_freak.lab
  ref_duration: 201.8
  offset_sec: 0.0

- id: jungle_boogie
  title: "Kool & The Gang — Jungle Boogie"
  url: "https://www.youtube.com/watch?v=XzGr4s4vgIY"   # Jungle Boogie (1973) HQ, 186s vs 186.2s ref (-0.1%); swapped in for
  lab: annotations/jungle_boogie.lab                    # "September" (EW&F) whose only available uploads run ~215s vs a 147.7s
  ref_duration: 186.2                                    # ref — a genuinely different edit, not a fixable constant offset.
  offset_sec: 0.0

- id: hold_on
  title: "Wilson Phillips — Hold On"
  url: "https://www.youtube.com/watch?v=uIbXvaE39wM"   # Hold On (Official Music Video), Wilson Phillips channel, 221s vs 221.4s ref (-0.2%)
  lab: annotations/hold_on.lab
  ref_duration: 221.4
  offset_sec: 0.0

- id: motownphilly
  title: "Boyz II Men — Motownphilly"
  url: "https://www.youtube.com/watch?v=Rciee-oQLoI"   # Motownphilly, Boyz II Men official channel, 236s vs 234.2s ref (+0.8%)
  lab: annotations/motownphilly.lab
  ref_duration: 234.2
  offset_sec: 0.0

- id: the_power
  title: "SNAP! — The Power"
  url: "https://www.youtube.com/watch?v=USxeSm1fpTA"   # The Power, SNAP! official channel, 221s vs 220.9s ref (+0.05%)
  lab: annotations/the_power.lab
  ref_duration: 220.9
  offset_sec: 0.0
