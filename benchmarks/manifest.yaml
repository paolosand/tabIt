# tabIt chord-accuracy benchmark — song manifest.
#
# TODO(you): fill each `url` with a YouTube upload that matches the Isophonics
# studio master the annotation was made against. Prefer official "The Beatles -
# Topic" uploads or the official remaster videos; avoid live versions and edits.
# `ref_duration` (already filled, from the annotation's last interval) flags an
# upload whose length drifts >3% from the master. Leave `offset_sec: 0.0` and
# only calibrate it by ear if a song is flagged or scores suspiciously low.
#
# Run:  python -m benchmarks.chord_accuracy   (from the repo root, venv active)

- id: twist_and_shout
  title: "The Beatles — Twist and Shout"
  url: "https://www.youtube.com/watch?v=2RicaUqd9Hg"   # Twist And Shout (Remastered 2009), official channel, 156s vs 153.2s ref (+1.8%)
  lab: annotations/beatles/twist_and_shout.lab
  ref_duration: 153.2
  offset_sec: 0.0

