[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabit-engine"
version = "0.5.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "numpy>=1.24,<2",
    "soundfile>=0.12",
    "librosa>=0.10",
    "yt-dlp>=2024.1",
    # Pinned to the exact version validated against this engine; mir_eval's
    # 0.7 -> 0.8.x line introduced API drift (e.g. chord/util signatures)
    # that isn't guaranteed compatible with the harness in this task.
    "mir_eval==0.8.2",
    # Heavy / native — validated in this task's smoke test:
    "essentia>=2.1b6.dev1110 ; sys_platform != 'win32'",
    # BTC chord model (engine/vendor/btc + the allowlisted loader in
    # engine/chords_btc.py). The default PyPI wheel on macOS is already CPU/MPS.
    # Highest version covered by the real-weights test (2.14.1); raise the cap
    # deliberately, after running `pytest -m integration` on the new torch.
    "torch>=2.0,<2.15",
    # Intel Macs: numba/llvmlite stopped shipping x86_64 macOS wheels after
    # these lines, and uv would otherwise pick the newest and try to build the
    # LLVM bindings from source. (Apple Silicon is unaffected.)
    "numba<0.63 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.46 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "pyyaml"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
tabit = "helper.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "api*", "helper*"]

[tool.setuptools.package-data]
"engine.vendor.btc" = ["LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that load real ML models / audio (slow; opt-in with -m integration)",
]
addopts = "-m 'not integration'"
