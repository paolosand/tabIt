name: Installer e2e

# Runs the real packaging/install.sh on macOS — the exact script public users
# pipe into `sh`. Deliberately stops at "installed, healthy, uninstalls
# cleanly": it does NOT analyze a real song, because that would need a real
# yt-dlp/YouTube download, and YouTube blocks datacenter IPs (the whole
# reason this project is local-first — see
# docs/superpowers/specs/2026-07-12-tabit-helper-packaging-design.md).
on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'helper/**'
      - 'engine/**'
      - 'api/**'
      - 'pyproject.toml'
      - '.github/workflows/installer-e2e.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'helper/**'
      - 'engine/**'
      - 'api/**'
      - 'pyproject.toml'
      - '.github/workflows/installer-e2e.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-uninstall:
    name: install.sh → health check → uninstall --purge
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The installer installs the engine from a self-contained wheel and must
      # never need git. Build the wheel from this checkout, the way release CI does.
      - name: Build the engine wheel from this checkout
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          # setuptools leaves an egg-info in the checkout; it must not shadow
          # the installed distribution when later steps run from here.
          rm -rf ./*.egg-info build
          ls "$RUNNER_TEMP/wheel"

      # Negative case, BEFORE the real install, in a throwaway HOME: with no
      # usable git and no wheel source the installer must stop with a plain
      # sentence, having created nothing.
      - name: No wheel and no git fails with a plain message
        run: |
          mkdir -p "$RUNNER_TEMP/h2"
          set +e
          HOME="$RUNNER_TEMP/h2" TABIT_ASSUME_NO_GIT=1 TABIT_REF=main \
            TABIT_REPO=https://github.com/paolosand/tabIt \
            sh packaging/install.sh >"$RUNNER_TEMP/neg.out" 2>"$RUNNER_TEMP/neg.err"
          status=$?
          set -e
          cat "$RUNNER_TEMP/neg.err"
          [ "$status" -eq 1 ] || { echo "expected exit 1, got $status" >&2; exit 1; }
          grep -q "tabIt can't download its engine" "$RUNNER_TEMP/neg.err"
          if [ -n "$(ls -A "$RUNNER_TEMP/h2")" ]; then
            echo "the failed install created files in HOME" >&2
            exit 1
          fi

      # TABIT_WHEEL points the installer at the wheel built above instead of
      # the GitHub release asset; TABIT_REPO/TABIT_REF are kept for the rest.
      - name: Run the installer against this checkout
        run: |
          wheel="$(ls "$RUNNER_TEMP"/wheel/tabit_engine-*.whl)"
          TABIT_WHEEL="$wheel" \
            TABIT_REPO="file://$GITHUB_WORKSPACE" TABIT_REF="${{ github.sha }}" \
            sh packaging/install.sh

      - name: VERSION file matches the installed engine
        run: |
          app="$HOME/Library/Application Support/tabIt"
          want="$("$app/env/bin/python" -I -c 'import engine; print(engine.__version__)')"
          got="$(cat "$app/VERSION")"
          echo "engine=$want VERSION=$got"
          [ -n "$want" ] && [ "$want" = "$got" ]

      - name: Engine was installed from the wheel, not from git
        run: |
          app="$HOME/Library/Application Support/tabIt"
          url="$("$app/env/bin/python" -I -c "import importlib.metadata as m; print(m.distribution('tabit-engine').read_text('direct_url.json') or '')")"
          echo "$url"
          case "$url" in *git+*) echo "installed from git" >&2; exit 1 ;; esac
          case "$url" in *file://*) ;; *) echo "direct_url.json does not reference a file:// wheel" >&2; exit 1 ;; esac

      # install.sh deliberately doesn't touch PATH itself (it just prints a
      # note) — do it here so later steps can call `tabit` directly.
      - name: Put tabit on PATH for later steps
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: tabit status reports healthy
        run: tabit status

      - name: /health responds with an engine version
        run: curl -sf http://127.0.0.1:28224/health | grep -q '"engineVersion":"0.4.1"'

      - name: tabit uninstall --purge leaves nothing behind
        run: |
          tabit uninstall --purge
          for path in \
            "$HOME/Library/Application Support/tabIt" \
            "$HOME/Library/LaunchAgents/com.tabit.helper.plist" \
            "$HOME/Library/Logs/tabIt" \
            "$HOME/.local/bin/tabit"; do
            if [ -e "$path" ]; then
              echo "uninstall left $path behind" >&2
              exit 1
            fi
          done
